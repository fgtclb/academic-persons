<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>

<f:comment>
    The section navigation. `menuSections` lists stable identifiers, `menuSectionsDatas` maps
    each to the profile relation it shows; a relation without records gets no link, exactly as
    `MenuSectionsDatas.html` renders no section for it.
</f:comment>

<nav
    class="academic-persons-detail__navigation"
    data-academic-persons-scrollspy-navigation
    aria-label="{f:translate(key: 'detail.navigation', extensionName: 'academic_persons')}"
>
    <ol class="nav flex-column academic-persons-detail__navigation-list list-unstyled">
        <f:for each="{publicProfile.details.menuSections}" as="menuSection">
            <f:variable name="fieldName" value="{publicProfile.details.menuSectionsDatas.{menuSection}}" />
            <f:if condition="{profile.{fieldName}}">
                <li class="nav-item academic-persons-detail__navigation-item">
                    <a
                        class="nav-link px-0 py-0 academic-persons-detail__navigation-link"
                        href="#academic-persons-detail-section-{data.uid}-{menuSection}"
                    >
                        <span class="academic-persons-detail__navigation-number" aria-hidden="true"></span>
                        <span class="academic-persons-detail__navigation-label">
                            <f:translate key="detail.{fieldName}" extensionName="academic_persons" />
                        </span>
                    </a>
                </li>
            </f:if>
        </f:for>
    </ol>
</nav>

</html>
