routeEnhancers:
  ProfileListAndDetailPlugin:
    type: Extbase
    extension: AcademicPersons
    plugin: ListAndDetail
    routes:
      - routePath: '/{profile_name}'
        _controller: 'Profile::detail'
        _arguments:
          profile_name: 'profile'
      - routePath: '/{localized_page}-{page}'
        _controller: 'Profile::list'
        _arguments:
          page: 'demand/currentPage'
      - routePath: '/{letter}'
        _controller: 'Profile::list'
        _arguments:
          letter: 'demand/alphabetFilter'
      - routePath: '/view-mode/{viewMode}'
        _controller: 'Profile::list'
        _arguments:
          viewMode: 'demand/viewMode'
      - routePath: '/view-mode/{viewMode}/{localized_page}-{page}'
        _controller: 'Profile::list'
        _arguments:
          viewMode: 'demand/viewMode'
          page: 'demand/currentPage'
      - routePath: '/view-mode/{viewMode}/{letter}'
        _controller: 'Profile::list'
        _arguments:
          viewMode: 'demand/viewMode'
          letter: 'demand/alphabetFilter'
    defaultController: 'Profile::list'
    # An aspect makes its variable match anything, slashes included. Pinned, the view
    # mode routes stay apart from each other and from the routes above.
    requirements:
      viewMode: '[^/]+'
      localized_page: '[^/]+'
      page: '[0-9]+'
      letter: '[a-z]'
    aspects:
      # The view modes a URL segment exists for. A mode missing here is still reachable,
      # with its value as a query argument; a site adds its own modes to this map.
      viewMode:
        type: StaticValueMapper
        map:
          list: list
          table: table
      localized_page:
        type: LocaleModifier
        default: 'page'
        localeMap:
          - locale: 'en_EN.*'
            value: 'page'
          - locale: 'de_DE.*'
            value: 'seite'
      profile_name:
        type: PersistedAliasMapper
        tableName: tx_academicpersons_domain_model_profile
        routeFieldName: slug
      page:
        type: StaticRangeMapper
        start: '1'
        end: '1000'
      letter:
        type: StaticRangeMapper
        start: 'a'
        end: 'z'
