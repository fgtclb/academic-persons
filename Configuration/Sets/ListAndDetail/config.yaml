# The combined profile list and detail content element.
#
# "typoscript" points at the folder that "Configuration/TCA/Overrides/sys_template.php"
# registers as a static template, and "pagets" at the file that
# "Configuration/TCA/Overrides/pages.php" registers - there is exactly one
# physical copy of each, so the two delivery mechanisms can never drift apart.
#
# The TypoScript folder holds nothing but an "include_static_file.txt" naming
# "Configuration/TypoScript/Default": all six content elements of this extension
# are driven by the one plugin namespace "plugin.tx_academicpersons", and that
# block is shipped once instead of six times.
name: fgtclb/academic-persons-list-and-detail
label: 'Academic Persons: Profile list and detail'
dependencies:
  - fgtclb/academic-base-ctype-group
typoscript: 'EXT:academic_persons/Configuration/TypoScript/ListAndDetail/'
pagets: 'EXT:academic_persons/Configuration/TSconfig/ListAndDetail/page.tsconfig'
