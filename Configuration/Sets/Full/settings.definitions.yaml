# Site settings of the shared "plugin.tx_academicpersons" block.
#
# Every path below is also assigned in
# "Configuration/TypoScript/Default/constants.typoscript", and the default has
# to be the same in both files: a site that uses the site set and the static
# template reads the constants after the site settings, so a differing default
# resets what the integrator configured, silently.
#
# The file used to exist twice, once per set folder, byte for byte. It now lives
# with the aggregate set only - see "config.yaml" next to it for what that means
# for a site that depends on a single component.
categories:
  academic:
    label: 'Academic'
  academic.persons:
    label: 'Persons'
    parent: academic

settings:
  plugin.tx_academicpersons.detailPid:
    label: 'Detail page'
    category: academic.persons
    type: int
    default: 0
  plugin.tx_academicpersons.detailLink:
    label: 'Link the names to the detail view'
    description: 'Applies to the names of the profiles in the list, card, selected profiles and selected contracts elements. "No link" is for a site without profile detail pages. An element can choose otherwise in its plugin options, and the list-and-detail element always links.'
    category: academic.persons
    type: string
    default: link
    enum:
      link: 'Link to the detail view'
      none: 'No link'
  plugin.tx_academicpersons.renderContentElementHeader:
    label: 'Render the content element header in the plugins'
    description: 'Only for a site whose content element layout renders no header. The layouts of EXT:fluid_styled_content and of the bootstrap package render it, and switched on there the header appears twice.'
    category: academic.persons
    type: bool
    default: false
  plugin.tx_academicpersons.demand.groupBy:
    label: 'Group by'
    category: academic.persons
    type: string
    default: lastNameAlpha
  plugin.tx_academicpersons.demand.sortBy:
    label: 'Sort by'
    category: academic.persons
    type: string
    default: lastName
  plugin.tx_academicpersons.demand.sortByDirection:
    label: 'Sort by direction'
    category: academic.persons
    type: string
    default: asc
  plugin.tx_academicpersons.pagination.resultsPerPage:
    label: 'Pagination | Results per page'
    category: academic.persons
    type: int
    default: 1
  plugin.tx_academicpersons.pagination.numberOfLinks:
    label: 'Pagination | Number of links'
    category: academic.persons
    type: int
    default: 5
  plugin.tx_academicpersons.alphabet.activeLetterResets:
    label: 'Letter navigation | The selected letter links back to the list without a letter'
    description: 'Off, the selected letter is marked as the current one and is not a link.'
    category: academic.persons
    type: bool
    default: false
  plugin.tx_academicpersons.viewMode.allowed:
    label: 'View modes | Allowed modes'
    description: 'Comma separated. The modes the default view mode and the visitor switch of a list may render; each one is the partial Profile/ViewMode/<Mode>.html.'
    category: academic.persons
    type: string
    default: 'list,table'
  plugin.tx_academicpersons.table.columns:
    label: 'View modes | Columns of the table'
    description: 'Comma separated, in this order: name, position, organisationalUnit, emailAddresses, phoneNumbers, room.'
    category: academic.persons
    type: string
    default: 'name,position,emailAddresses,phoneNumbers,room'
  plugin.tx_academicpersons.image.list.cropVariant:
    label: 'Image | Crop variant of the lists'
    description: 'The crop variant of a profile image in the list, list and detail, selected profiles and selected contracts elements, and in the contacts of a page. A name the image does not define shows it uncropped.'
    category: academic.persons
    type: string
    default: 'default'
  plugin.tx_academicpersons.image.card.cropVariant:
    label: 'Image | Crop variant of the card'
    description: 'The crop variant of a profile image in the card element. A name the image does not define shows it uncropped.'
    category: academic.persons
    type: string
    default: 'default'
  plugin.tx_academicpersons.image.detail.cropVariant:
    label: 'Image | Crop variant of the profile detail'
    description: 'The crop variant of the profile image in the public profile. A name the image does not define shows it uncropped.'
    category: academic.persons
    type: string
    default: 'default'
  # A settings node holds either a value or children, never both, so the generic
  # placeholder is "placeholder.default" rather than "placeholder" itself.
  plugin.tx_academicpersons.image.placeholder.default:
    label: 'Image | Placeholder of a profile without image'
    description: 'An EXT: path to a public file. Empty shows no image, unless a placeholder of the profile gender applies.'
    category: academic.persons
    type: string
    default: 'EXT:academic_persons/Resources/Public/Images/ProfilePlaceholder.svg'
  plugin.tx_academicpersons.image.placeholder.mr:
    label: 'Image | Placeholder of a profile of the gender "mr" without image'
    description: 'An EXT: path to a public file. Empty uses the default placeholder.'
    category: academic.persons
    type: string
    default: ''
  plugin.tx_academicpersons.image.placeholder.ms:
    label: 'Image | Placeholder of a profile of the gender "ms" without image'
    description: 'An EXT: path to a public file. Empty uses the default placeholder.'
    category: academic.persons
    type: string
    default: ''
  plugin.tx_academicpersons.image.placeholder.diverse:
    label: 'Image | Placeholder of a profile of the gender "diverse" without image'
    description: 'An EXT: path to a public file. Empty uses the default placeholder.'
    category: academic.persons
    type: string
    default: ''
  plugin.tx_academicpersons.phoneNumbers.telPrefix:
    label: 'Phone numbers | Prefix of a phone link target'
    description: 'Prepended to the "tel:" target of every phone number, never to its visible text. For an installation that stores extensions only.'
    category: academic.persons
    type: string
    default: ''
