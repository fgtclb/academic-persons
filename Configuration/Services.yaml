services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicPersons\:
    resource: '../Classes/*'
    exclude:
      # The status provider implements an interface of EXT:reports and is
      # registered by Services.php only when that extension is loaded.
      - '../Classes/Domain/Model/*.php'
      - '../Classes/Report/*'

  FGTCLB\AcademicPersons\Domain\Model\Dto\DemandInterface:
    alias: FGTCLB\AcademicPersons\Domain\Model\Dto\ProfileDemand
    public: true

  # Instantiated by the DataHandler through GeneralUtility::makeInstance(), which
  # resolves a public service from the container - constructor injection needs it.
  FGTCLB\AcademicPersons\Hook\DataHandlerHooks:
    public: true

  FGTCLB\AcademicPersons\EventListener\UpdateProfileImageMetadata:
    tags:
      - name: event.listener
        identifier: academicPersonsUpdateProfileImageMetadata
        event: FGTCLB\AcademicPersons\Event\AfterProfileUpdateEvent

  FGTCLB\AcademicPersons\Settings\AcademicPersonsSettings:
    public: true
    factory:
      - '@FGTCLB\AcademicPersons\Settings\AcademicPersonsSettingsFactory'
      - 'get'

  FGTCLB\AcademicPersons\Command\CreateProfilesCommand:
    tags:
      - name: console.command
        command: 'academic:createprofiles'
        description: 'This command create profiles for all frontend users that do not have a profile yet but should have one.'

  FGTCLB\AcademicPersons\Command\UpdateProfilesCommand:
    tags:
      - name: console.command
        command: 'academic:updateprofiles'
        description: 'This command updates profiles for all frontend users that have a profile.'

  FGTCLB\AcademicPersons\Command\MigrateSettingsCommand:
    tags:
      - name: console.command
        command: 'academic:persons:settings:migrate'
        description: 'Prints the section maps a package still shipping the pre-3.0 "validations" or "profileInformationsTypes" keys of Configuration/AcademicPersons/Settings.yaml should replace them with; exits with 1 when such a package exists.'
        schedulable: false
