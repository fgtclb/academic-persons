services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  FGTCLB\AcademicPersons\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*.php'

  FGTCLB\AcademicPersons\Domain\Model\Dto\DemandInterface:
    alias: FGTCLB\AcademicPersons\Domain\Model\Dto\ProfileDemand
    public: true

  FGTCLB\AcademicPersons\Settings\AcademicPersonsSettings:
    public: true
    factory:
      - '@FGTCLB\AcademicPersons\Settings\AcademicPersonsSettingsFactory'
      - 'get'

  FGTCLB\AcademicPersons\Command\CreateProfilesCommand:
    tags:
      - name: console.command
        command: 'academic:createprofiles'
        description: 'This command create profiles for all frontend users that do not have a profile yet but should have one.'

  FGTCLB\AcademicPersons\Command\UpdateProfilesCommand:
    tags:
      - name: console.command
        command: 'academic:updateprofiles'
        description: 'This command updates profiles for all frontend users that have a profile.'

  # Instantiated by the DataHandler through GeneralUtility::makeInstance(), which
  # resolves a public service from the container - constructor injection needs it.
  FGTCLB\AcademicPersons\Hook\ContractSortingHook:
    public: true

  # The DataHandler hook of the same rule covers the backend only; an Extbase write
  # never reaches it. Both persistence events are needed: one for a contract that is
  # created, one for a contract that is updated.
  FGTCLB\AcademicPersons\EventListener\AssignContractOrganisationalUnitSorting:
    tags:
      - name: event.listener
        identifier: academicPersonsAssignContractOrganisationalUnitSortingOnAdd
        method: afterEntityAdded
        event: TYPO3\CMS\Extbase\Event\Persistence\EntityAddedToPersistenceEvent
      - name: event.listener
        identifier: academicPersonsAssignContractOrganisationalUnitSortingOnUpdate
        method: afterEntityUpdated
        event: TYPO3\CMS\Extbase\Event\Persistence\EntityUpdatedInPersistenceEvent
