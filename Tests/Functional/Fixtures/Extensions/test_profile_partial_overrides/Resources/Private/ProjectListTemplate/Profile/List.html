<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A project's list template written before the letter navigation knew which letters lead
    somewhere: it renders the shipped navigation with the demand alone.
</f:comment>
<div class="academic-persons-list">
    <f:if condition="{settings.alphabetPaginationEnabled}">
        <f:render
            partial="Profile/List/AlphabetPagination"
            arguments="{demand: demand}"
        />
    </f:if>

    <f:render
        partial="Profile/List/ItemList"
        arguments="{_all}"
    />
</div>

</html>
