<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<ul class="test-contact-cards-camel">
    <f:if condition="{contracts}">
        <f:then>
            <f:for each="{contracts}" as="contract">
                <li class="test-contact-card-camel">{contract.profile.firstName} {contract.profile.lastName}</li>
            </f:for>
        </f:then>
        <f:else>
            <f:for each="{profiles}" as="profile">
                <li class="test-contact-card-camel">{profile.firstName} {profile.lastName}</li>
            </f:for>
        </f:else>
    </f:if>
</ul>

</html>
